# FileBrowser Quantum v1.5.2-stable configuration
# Company file server - proxy auth via Authelia, subpath /files
# Schema verified from `filebrowser setup` default output (2026-08-20)
# NOTE: port/listen/baseURL/externalUrl live under `server:`, NOT `http:`

server:
  database: /home/ubuntu/filebrowser/database.db
  cacheDir: /home/ubuntu/filebrowser/cache
  cacheDirCleanup: false
  port: 18080
  listen: "127.0.0.1"
  baseURL: /files
  externalUrl: "https://218.17.143.249:8099/files"
  sources:
    - path: /home/ubuntu/dsh-files
      name: 公司文件
  disableUpdateCheck: true
  disableWebDAV: false
  filesystem:
    createFilePermission: "644"
    createDirectoryPermission: "755"

auth:
  tokenExpirationHours: 2
  methods:
    proxy:
      enabled: true
      # 这个头【名字本身是密钥】，由 scripts/init-secrets.sh 生成随机后缀并同步到
      # nginx/conf/generated/fb-auth.conf。原因：dsh 沙箱与宿主共享网络命名空间，
      # 能连上 127.0.0.1:18080；若沿用固定的 X-Forwarded-User，任何员工都能在自己的
      # dsh 里 curl 伪造 admin 身份直调本 API 读写全公司文件，文件系统隔离等于白做。
      # 沙箱内看不到本文件，因而拿不到头名。首次部署跑一次 init-secrets.sh 即可。
      header: "X-Fb-Auth-69ee0f8989442f3e495843c46207e0cc"
      createUser: false
    password:
      enabled: false
  adminUsername: admin
  adminPassword: "CHANGE_ME_FIRST_BOOT"

http:
  trustedHeaders:
    - X-Forwarded-Proto
    - X-Forwarded-Host
    - X-Forwarded-For
    - X-Real-IP
  disableRateLimit: false
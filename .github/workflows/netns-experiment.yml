name: netns 隔离实验

# 只在改动本文件时触发（不污染主 CI），也可手动 dispatch。
# 目的：验证能否给每个 dsh 实例独立网络命名空间，从而封掉
# 「员工 A 直连员工 B 的 dsh 端口」这条已知残留风险。
# 本地嵌套容器里 pasta 起不来（非 root uid 映射受限），所以搬到 runner 上做。
on:
  push:
    paths: ['.github/workflows/netns-experiment.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  netns:
    name: pasta 网络命名空间隔离
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          echo "whoami: $(whoami)  uid=$(id -u)"
          echo "kernel: $(uname -r)"
          . /etc/os-release && echo "os: $PRETTY_NAME"

      - name: 安装 bubblewrap 与 passt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap passt
          echo "bwrap:  $(bwrap --version)"
          echo "pasta:  $(pasta --version 2>&1 | head -2 | tr '\n' ' ')"

      - name: 放开非特权 user namespace 限制
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: 安装 socat 与 nginx
        run: sudo apt-get install -y socat nginx-light

      - name: 实验三 —— 私有 netns（pasta 出网）+ unix socket 入站
        run: |
          set -u
          pass=0; fail=0
          ok()  { printf '  \xe2\x9c\x85 %-44s %s\n' "$1" "${2:-}"; pass=$((pass+1)); }
          bad() { printf '  \xe2\x9d\x8c %-44s %s\n' "$1" "${2:-}"; fail=$((fail+1)); }
          inf() { printf '  .  %-44s %s\n' "$1" "${2:-}"; }

          # 实验二结论：--no-splice 无效，pasta 仍把命名空间回环转发到宿主回环；
          # 但网关与宿主 eth0 两条路都被堵死。既然只有【绑在宿主回环上】的服务
          # 够得到，那就别在宿主回环上留 dsh 的端口 —— 端口不存在就无从转发。
          # 入站改走 unix socket。
          SOCKDIR="$RUNNER_TEMP/socks"; mkdir -p "$SOCKDIR"
          RESOLV="$RUNNER_TEMP/resolv.conf"; echo "nameserver 10.0.2.3" > "$RESOLV"
          HOSTIP=$(ip route get 1.1.1.1 2>/dev/null | awk '{print $7; exit}')
          echo "宿主 eth0: $HOSTIP"

          python3 -c "
          import http.server
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(s):
                  s.send_response(200); s.end_headers(); s.wfile.write(b'HOST-SERVICE')
              def log_message(*a): pass
          http.server.HTTPServer(('127.0.0.1',18080),H).serve_forever()" &
          HOSTSVC=$!

          # 沙箱内的实例脚本：socat 把挂进来的 unix socket 桥到本 netns 的 13101
          {
            echo 'socat UNIX-LISTEN:"$SOCK",fork,mode=600 TCP:127.0.0.1:13101 &'
            echo 'exec python3 -c "'
            echo 'import http.server, os'
            echo 'who = os.environ[\"WHO\"]'
            echo 'class H(http.server.BaseHTTPRequestHandler):'
            echo '    def do_GET(s):'
            echo '        s.send_response(200); s.end_headers(); s.wfile.write((\"dsh-\"+who).encode())'
            echo '    def log_message(*a): pass'
            echo 'http.server.HTTPServer((\"127.0.0.1\",13101),H).serve_forever()"'
          } > "$RUNNER_TEMP/inst.sh"

          launch() {
            local who=$1
            timeout 100 pasta --config-net --no-map-gw --dns-forward 10.0.2.3 -- \
              bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp \
                    --ro-bind "$RESOLV" /etc/resolv.conf \
                    --bind "$SOCKDIR" "$SOCKDIR" \
                    --setenv SOCK "$SOCKDIR/$who.sock" --setenv WHO "$who" \
                    --unshare-user --unshare-ipc --unshare-pid --unshare-uts --share-net \
                    -- bash "$RUNNER_TEMP/inst.sh" >/dev/null 2>&1 &
          }

          echo "=== 起两个实例（员工 A / 员工 B），各自私有 netns ==="
          launch B; PB=$!
          launch A; PA=$!
          sleep 10
          ls -l "$SOCKDIR" | sed 's/^/     /'
          echo

          echo "=== 1. nginx（宿主）经 unix socket 连实例 ==="
          FROM_HOST=$(curl -s --max-time 5 --unix-socket "$SOCKDIR/B.sock" http://x/ 2>/dev/null || echo "")
          if [ "$FROM_HOST" = "dsh-B" ]; then ok "宿主经 unix socket 连到 B" "nginx -> dsh 通"
          else bad "宿主经 unix socket 连不到 B" "收到 '${FROM_HOST:-空}'"; fi

          echo
          echo "=== 2. 宿主回环/网卡上是否还留着 13101 端口 ==="
          P1=$(curl -s --max-time 4 -o /dev/null -w '%{http_code}' http://127.0.0.1:13101/ 2>/dev/null)
          P2=$(curl -s --max-time 4 -o /dev/null -w '%{http_code}' "http://$HOSTIP:13101/" 2>/dev/null)
          NL=$(ss -ltn 2>/dev/null | grep -c ':13101' || true)
          [ "$P1" = "000" ] && ok "宿主回环上无 13101" || bad "宿主回环上仍有 13101" "HTTP $P1"
          [ "$P2" = "000" ] && ok "宿主 eth0 上无 13101" || bad "宿主 eth0 上仍有 13101" "HTTP $P2"
          inf "ss -ltn 中的 13101 监听数" "$NL"

          echo
          echo "=== 3. 员工 A 能否连到员工 B 的实例（本轮核心） ==="
          A_LOOP=$(timeout 30 pasta --config-net --no-map-gw -- \
                     curl -s --max-time 5 http://127.0.0.1:13101/ 2>/dev/null || echo "")
          A_EXT=$(timeout 30 env HOSTIP="$HOSTIP" pasta --config-net --no-map-gw -- \
                     bash -c 'curl -s --max-time 5 "http://$HOSTIP:13101/" 2>/dev/null' || echo "")
          A_SOCK=$(timeout 30 bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp \
                     --tmpfs "$SOCKDIR" --unshare-user -- \
                     curl -s --max-time 5 --unix-socket "$SOCKDIR/B.sock" http://x/ 2>/dev/null || echo "")
          inf "A 经 127.0.0.1:13101" "'${A_LOOP:-空}'"
          inf "A 经 $HOSTIP:13101" "'${A_EXT:-空}'"
          inf "A 经 B 的 unix socket" "'${A_SOCK:-空}' (socket 未挂进 A)"
          if [ -z "$A_LOOP" ] && [ -z "$A_EXT" ] && [ -z "$A_SOCK" ]; then
            ok "员工 A 无法连到员工 B" "残留风险已封堵"
          else
            bad "员工 A 仍能连到员工 B" "未封堵"
          fi

          echo
          echo "=== 4. 沙箱内出网（dsh 要调模型 API） ==="
          NETOUT=$(timeout 60 pasta --config-net --no-map-gw --dns-forward 10.0.2.3 -- \
                    bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp \
                          --ro-bind "$RESOLV" /etc/resolv.conf --unshare-user --share-net -- \
                    bash -c 'echo "DNS=$(getent hosts github.com >/dev/null 2>&1 && echo YES || echo NO)"; echo "HTTPS=$(curl -s --max-time 8 -o /dev/null -w "%{http_code}" https://github.com 2>/dev/null)"' 2>&1)
          echo "$NETOUT" | grep -E '^(DNS|HTTPS)=' | sed 's/^/     /'
          echo "$NETOUT" | grep -q 'DNS=YES' && ok "DNS 可用" || bad "DNS 不可用"
          echo "$NETOUT" | grep -qE 'HTTPS=(200|301|302)' && ok "出网 HTTPS 可用" || bad "出网 HTTPS 不可用"

          echo
          echo "=== 5. nginx 能否 proxy_pass 到 unix socket ==="
          {
            printf 'events {}\n'
            printf 'http {\n  access_log off;\n  server {\n    listen 18099;\n'
            printf '    location / { proxy_pass http://unix:%s/B.sock:/; }\n' "$SOCKDIR"
            printf '  }\n}\n'
          } > "$RUNNER_TEMP/ng.conf"
          sudo nginx -c "$RUNNER_TEMP/ng.conf" -g "pid $RUNNER_TEMP/ng.pid; error_log $RUNNER_TEMP/ng.err;" 2>&1 | sed 's/^/     /' || true
          sleep 2
          VIA=$(curl -s --max-time 5 http://127.0.0.1:18099/ 2>/dev/null || echo "")
          if [ "$VIA" = "dsh-B" ]; then ok "nginx proxy_pass 到 unix socket 成功"
          else bad "nginx 经 unix socket 失败" "收到 '${VIA:-空}' $(tail -2 "$RUNNER_TEMP/ng.err" 2>/dev/null | tr '\n' ' ')"; fi
          sudo nginx -s quit -c "$RUNNER_TEMP/ng.conf" 2>/dev/null || true
          kill $PA $PB $HOSTSVC 2>/dev/null || true

          echo
          echo "================================================"
          printf '  通过 %d 项，失败 %d 项\n' "$pass" "$fail"
          echo "================================================"
          exit 0

name: netns 隔离实验

# 只在改动本文件时触发（不污染主 CI），也可手动 dispatch。
# 目的：验证能否给每个 dsh 实例独立网络命名空间，从而封掉
# 「员工 A 直连员工 B 的 dsh 端口」这条已知残留风险。
# 本地嵌套容器里 pasta 起不来（非 root uid 映射受限），所以搬到 runner 上做。
on:
  push:
    paths: ['.github/workflows/netns-experiment.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  netns:
    name: pasta 网络命名空间隔离
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          echo "whoami: $(whoami)  uid=$(id -u)"
          echo "kernel: $(uname -r)"
          . /etc/os-release && echo "os: $PRETTY_NAME"

      - name: 安装 bubblewrap 与 passt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap passt
          echo "bwrap:  $(bwrap --version)"
          echo "pasta:  $(pasta --version 2>&1 | head -2 | tr '\n' ' ')"

      - name: 放开非特权 user namespace 限制
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: pasta 全部选项（上轮 grep 太窄，漏了 --no-splice）
        run: pasta --help 2>&1 || true

      - name: 实验二 —— --no-splice 能否封住回环，以及 DNS 会不会被连带打断
        run: |
          set -u
          pass=0; fail=0
          ok()  { printf '  ✅ %-46s %s\n' "$1" "${2:-}"; pass=$((pass+1)); }
          bad() { printf '  ❌ %-46s %s\n' "$1" "${2:-}"; fail=$((fail+1)); }
          inf() { printf '  ·  %-46s %s\n' "$1" "${2:-}"; }

          python3 -c "
          import http.server
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(s):
                  s.send_response(200); s.end_headers(); s.wfile.write(b'HOST-SERVICE')
              def log_message(*a): pass
          http.server.HTTPServer(('127.0.0.1',18080),H).serve_forever()" &
          HOSTSVC=$!
          sleep 1
          echo "宿主 resolv.conf:"; sed 's/^/     /' /etc/resolv.conf
          echo

          # 上一轮的教训：curl 连不上时自己输出 000，再 || echo 000 会拼成 000000
          PROBE='
          code() { curl -s --max-time 4 -o /dev/null -w "%{http_code}" "$@" 2>/dev/null; }
          echo "LOOP=$(code http://127.0.0.1:18080/)"
          GW=$(ip route show default 2>/dev/null | awk "{print \$3}" | head -1)
          echo "GWADDR=$GW"; echo "GWSVC=$(code http://$GW:18080/)"
          echo "HOSTIP_SVC=$(code http://$HOSTIP:18080/)"
          echo "DNS=$(getent hosts github.com >/dev/null 2>&1 && echo YES || echo NO)"
          echo "HTTPS=$(code https://github.com)"
          echo "RESOLV=$(tr "\n" ";" < /etc/resolv.conf | head -c 120)"
          '
          HOSTIP=$(ip route get 1.1.1.1 2>/dev/null | awk '{print $7; exit}')
          echo "宿主 eth0 地址: $HOSTIP"; echo

          run() { timeout 60 env HOSTIP="$HOSTIP" pasta "$@" -- bash -c "$PROBE" 2>&1 || echo RUNFAIL; }
          rep() { echo "$1" | sed -n "s/^$2=//p" | head -1; }

          for variant in "基线(仅 --no-map-gw)|--config-net --no-map-gw" \
                         "加 --no-splice|--config-net --no-map-gw --no-splice"; do
            label="${variant%%|*}"; flags="${variant#*|}"
            echo "=== $label  [pasta $flags] ==="
            # shellcheck disable=SC2086
            OUT=$(run $flags)
            echo "$OUT" | grep -E '^(LOOP|GWSVC|HOSTIP_SVC|DNS|HTTPS|RESOLV|RUNFAIL)=' | sed 's/^/     /'
            L=$(rep "$OUT" LOOP); D=$(rep "$OUT" DNS); H=$(rep "$OUT" HTTPS)
            G=$(rep "$OUT" GWSVC); I=$(rep "$OUT" HOSTIP_SVC)
            [ "$L" = "000" ] && ok "[$label] 宿主回环不可达" || bad "[$label] 宿主回环可达" "HTTP $L"
            [ "$G" = "000" ] && ok "[$label] 经网关回连被阻断" || bad "[$label] 经网关可回连" "HTTP $G"
            [ "$I" = "000" ] && ok "[$label] 经宿主 eth0 地址不可达" || bad "[$label] 经宿主 eth0 可达" "HTTP $I"
            [ "$D" = "YES" ] && ok "[$label] DNS 可用" || bad "[$label] DNS 不可用" "dsh 调不了模型 API"
            case "$H" in 200|301|302) ok "[$label] 出网 HTTPS 可用" "HTTP $H";;
                         *) bad "[$label] 出网 HTTPS 不可用" "HTTP $H";; esac
            echo
          done

          echo "=== 若 --no-splice 打断了 DNS：用 pasta 自带的 DNS 转发器补回来 ==="
          mkdir -p "$RUNNER_TEMP/ns"
          echo "nameserver 10.0.2.3" > "$RUNNER_TEMP/ns/resolv.conf"
          OUT=$(timeout 60 env HOSTIP="$HOSTIP" pasta --config-net --no-map-gw --no-splice \
                  --dns-forward 10.0.2.3 -- \
                  bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp \
                        --ro-bind "$RUNNER_TEMP/ns/resolv.conf" /etc/resolv.conf \
                        --unshare-user --unshare-ipc --unshare-pid --unshare-uts --share-net \
                        -- bash -c "$PROBE" 2>&1 || echo RUNFAIL)
          echo "$OUT" | grep -E '^(LOOP|GWSVC|HOSTIP_SVC|DNS|HTTPS|RESOLV|RUNFAIL)=' | sed 's/^/     /'
          L=$(rep "$OUT" LOOP); D=$(rep "$OUT" DNS); H=$(rep "$OUT" HTTPS)
          [ "$L" = "000" ] && ok "[完整形态] 宿主回环不可达" || bad "[完整形态] 宿主回环可达" "HTTP $L"
          [ "$D" = "YES" ] && ok "[完整形态] DNS 可用（经 --dns-forward）" || bad "[完整形态] DNS 不可用"
          case "$H" in 200|301|302) ok "[完整形态] 出网 HTTPS 可用" "HTTP $H";;
                       *) bad "[完整形态] 出网 HTTPS 不可用" "HTTP $H";; esac
          echo

          echo "=== 入站转发 + 实例间隔离（最关键） ==="
          # 员工 B 的实例：只绑宿主回环，nginx 能连，外部网卡连不到
          timeout 60 pasta --config-net --no-map-gw --no-splice -t 127.0.0.1/13101 -- bash -c '
            python3 -c "
          import http.server
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(s):
                  s.send_response(200); s.end_headers(); s.wfile.write(b\"dsh-B\")
              def log_message(*a): pass
          http.server.HTTPServer((\"0.0.0.0\",13101),H).serve_forever()" ' &
          PB=$!
          sleep 7
          FROM_HOST=$(curl -s --max-time 5 http://127.0.0.1:13101/ 2>/dev/null || echo "")
          [ "$FROM_HOST" = "dsh-B" ] && ok "nginx（宿主）能连到 B 的实例" \
                                     || bad "宿主连不到 B 的实例" "收到 '${FROM_HOST:-空}'"
          FROM_EXT=$(curl -s --max-time 5 "http://$HOSTIP:13101/" 2>/dev/null || echo "")
          [ -z "$FROM_EXT" ] && ok "B 的实例未暴露在宿主外部网卡上" \
                             || bad "B 的实例暴露在 $HOSTIP:13101" "收到 '$FROM_EXT'"
          # 员工 A：另一个沙箱，试图连 B
          A1=$(timeout 30 pasta --config-net --no-map-gw --no-splice -- \
                 curl -s --max-time 5 http://127.0.0.1:13101/ 2>/dev/null || echo "")
          A2=$(timeout 30 env HOSTIP="$HOSTIP" pasta --config-net --no-map-gw --no-splice -- \
                 bash -c 'curl -s --max-time 5 "http://$HOSTIP:13101/" 2>/dev/null' || echo "")
          inf "A 经 127.0.0.1 连 B" "收到 '${A1:-空}'"
          inf "A 经 $HOSTIP 连 B" "收到 '${A2:-空}'"
          if [ -z "$A1" ] && [ -z "$A2" ]; then
            ok "员工 A 无法连到员工 B 的实例" "★ 残留风险已封堵"
          else
            bad "员工 A 仍能连到员工 B 的实例" "★ 未封堵"
          fi
          kill $PB $HOSTSVC 2>/dev/null || true

          echo
          echo "================================================"
          printf '  通过 %d 项，失败 %d 项\n' "$pass" "$fail"
          echo "================================================"
          exit 0

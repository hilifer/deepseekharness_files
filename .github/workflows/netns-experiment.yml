name: netns 隔离实验

# 只在改动本文件时触发（不污染主 CI），也可手动 dispatch。
# 目的：验证能否给每个 dsh 实例独立网络命名空间，从而封掉
# 「员工 A 直连员工 B 的 dsh 端口」这条已知残留风险。
# 本地嵌套容器里 pasta 起不来（非 root uid 映射受限），所以搬到 runner 上做。
on:
  push:
    paths: ['.github/workflows/netns-experiment.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  netns:
    name: pasta 网络命名空间隔离
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          echo "whoami: $(whoami)  uid=$(id -u)"
          echo "kernel: $(uname -r)"
          . /etc/os-release && echo "os: $PRETTY_NAME"

      - name: 安装 bubblewrap 与 passt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap passt
          echo "bwrap:  $(bwrap --version)"
          echo "pasta:  $(pasta --version 2>&1 | head -2 | tr '\n' ' ')"

      - name: 放开非特权 user namespace 限制
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: 安装 socat
        run: sudo apt-get install -y socat

      - name: |
          实验三 —— 结论性方案：私有 netns（pasta 出网）+ unix socket 入站
        run: |
          set -u
          pass=0; fail=0
          ok()  { printf '  ✅ %-46s %s\n' "$1" "${2:-}"; pass=$((pass+1)); }
          bad() { printf '  ❌ %-46s %s\n' "$1" "${2:-}"; fail=$((fail+1)); }
          inf() { printf '  ·  %-46s %s\n' "$1" "${2:-}"; }

          # 实验二的结论：pasta 会把命名空间回环转发到宿主回环，--no-splice 无效。
          # 所以不要在宿主回环上留下 dsh 的端口 —— 端口不存在，就没什么可连的。
          # 入站改走 unix socket（nginx 原生支持 proxy_pass http://unix:...）。
          SOCKDIR="$RUNNER_TEMP/socks"; mkdir -p "$SOCKDIR"
          RESOLV="$RUNNER_TEMP/resolv.conf"; echo "nameserver 10.0.2.3" > "$RESOLV"
          HOSTIP=$(ip route get 1.1.1.1 2>/dev/null | awk '{print $7; exit}')

          # 宿主上的「FileBrowser」，用来观察回环 splice 是否仍然存在
          python3 -c "
          import http.server
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(s):
                  s.send_response(200); s.end_headers(); s.wfile.write(b'HOST-SERVICE')
              def log_message(*a): pass
          http.server.HTTPServer(('127.0.0.1',18080),H).serve_forever()" &
          HOSTSVC=$!
          sleep 1

          cat > "$RUNNER_TEMP/inst.sh" <<'INNER'
          # 沙箱内：socat 把 bind-mount 进来的 unix socket 桥到本 netns 的 13101，
          # 然后起「dsh」。13101 只存在于本实例私有的网络命名空间里。
          socat UNIX-LISTEN:"$SOCK",fork,mode=600 TCP:127.0.0.1:13101 &
          exec python3 -c "
          import http.server, os
          who = os.environ['WHO']
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(s):
                  s.send_response(200); s.end_headers(); s.wfile.write(f'dsh-{who}'.encode())
              def log_message(*a): pass
          http.server.HTTPServer(('127.0.0.1',13101),H).serve_forever()"
INNER

          launch() { # $1=name
            local who=$1
            timeout 90 pasta --config-net --no-map-gw --dns-forward 10.0.2.3 -- \
              bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp \
                    --ro-bind "$RESOLV" /etc/resolv.conf \
                    --bind "$SOCKDIR" "$SOCKDIR" \
                    --setenv SOCK "$SOCKDIR/$who.sock" --setenv WHO "$who" \
                    --unshare-user --unshare-ipc --unshare-pid --unshare-uts --share-net \
                    -- bash "$RUNNER_TEMP/inst.sh" &
          }

          echo "=== 起两个实例（员工 B 与员工 A），各自私有 netns ==="
          launch B; PB=$!
          launch A; PA=$!
          sleep 8
          ls -l "$SOCKDIR" | sed 's/^/     /'
          echo

          echo "=== 1. nginx（宿主）经 unix socket 能否连到实例 ==="
          FROM_HOST=$(curl -s --max-time 5 --unix-socket "$SOCKDIR/B.sock" http://x/ 2>/dev/null || echo "")
          [ "$FROM_HOST" = "dsh-B" ] && ok "宿主经 unix socket 连到 B" "nginx -> dsh 这条路通" \
                                     || bad "宿主经 unix socket 连不到 B" "收到 '${FROM_HOST:-空}'"

          echo
          echo "=== 2. B 的实例是否还在宿主回环/网卡上留了端口 ==="
          P1=$(curl -s --max-time 4 -o /dev/null -w '%{http_code}' http://127.0.0.1:13101/ 2>/dev/null)
          P2=$(curl -s --max-time 4 -o /dev/null -w '%{http_code}' "http://$HOSTIP:13101/" 2>/dev/null)
          [ "$P1" = "000" ] && ok "宿主回环上无 13101 端口" || bad "宿主回环上仍有 13101" "HTTP $P1"
          [ "$P2" = "000" ] && ok "宿主外部网卡上无 13101 端口" || bad "宿主 eth0 上仍有 13101" "HTTP $P2"
          inf "宿主 ss 结果" "$(ss -ltn 2>/dev/null | grep -c ':13101' || echo 0) 个 13101 监听"

          echo
          echo "=== 3. ★ 员工 A 能否连到员工 B 的实例 ==="
          A_LOOP=$(timeout 30 pasta --config-net --no-map-gw -- \
                     curl -s --max-time 5 http://127.0.0.1:13101/ 2>/dev/null || echo "")
          A_EXT=$(timeout 30 env HOSTIP="$HOSTIP" pasta --config-net --no-map-gw -- \
                     bash -c 'curl -s --max-time 5 "http://$HOSTIP:13101/" 2>/dev/null' || echo "")
          A_SOCK=$(timeout 30 pasta --config-net --no-map-gw -- \
                     bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp \
                           --unshare-user --share-net -- \
                     curl -s --max-time 5 --unix-socket "$SOCKDIR/B.sock" http://x/ 2>/dev/null || echo "")
          inf "A 经 127.0.0.1:13101" "'${A_LOOP:-空}'"
          inf "A 经 $HOSTIP:13101" "'${A_EXT:-空}'"
          inf "A 经 B 的 unix socket" "'${A_SOCK:-空}'（socket 未挂进 A 的沙箱）"
          if [ -z "$A_LOOP" ] && [ -z "$A_EXT" ] && [ -z "$A_SOCK" ]; then
            ok "员工 A 无法连到员工 B 的实例" "★★ 残留风险已封堵"
          else
            bad "员工 A 仍能连到员工 B" "★★ 未封堵"
          fi

          echo
          echo "=== 4. 沙箱内出网是否仍然可用（dsh 要调模型 API） ==="
          NETOUT=$(timeout 60 pasta --config-net --no-map-gw --dns-forward 10.0.2.3 -- \
                    bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp \
                          --ro-bind "$RESOLV" /etc/resolv.conf --unshare-user --share-net -- \
                    bash -c 'echo "DNS=$(getent hosts github.com >/dev/null 2>&1 && echo YES || echo NO)";
                             echo "HTTPS=$(curl -s --max-time 8 -o /dev/null -w "%{http_code}" https://github.com 2>/dev/null)"' 2>&1)
          echo "$NETOUT" | grep -E '^(DNS|HTTPS)=' | sed 's/^/     /'
          echo "$NETOUT" | grep -q 'DNS=YES' && ok "DNS 可用" || bad "DNS 不可用"
          echo "$NETOUT" | grep -qE 'HTTPS=(200|301|302)' && ok "出网 HTTPS 可用" || bad "出网 HTTPS 不可用"

          echo
          echo "=== 5. nginx 真的能 proxy_pass 到 unix socket 吗 ==="
          sudo apt-get install -y -qq nginx-light >/dev/null 2>&1 || true
          cat > "$RUNNER_TEMP/ng.conf" <<NGEOF
          events {}
          http {
            access_log off;
            server {
              listen 18099;
              location / { proxy_pass http://unix:$SOCKDIR/B.sock:/; }
            }
          }
NGEOF
          sudo nginx -c "$RUNNER_TEMP/ng.conf" -g "pid $RUNNER_TEMP/ng.pid; error_log $RUNNER_TEMP/ng.err;" 2>&1 | sed 's/^/     /' || true
          sleep 2
          VIA_NGINX=$(curl -s --max-time 5 http://127.0.0.1:18099/ 2>/dev/null || echo "")
          [ "$VIA_NGINX" = "dsh-B" ] && ok "nginx proxy_pass 到 unix socket 成功" "收到 '$VIA_NGINX'" \
                                     || bad "nginx 经 unix socket 失败" "收到 '${VIA_NGINX:-空}' $(tail -2 "$RUNNER_TEMP/ng.err" 2>/dev/null | tr '\n' ' ')"
          sudo nginx -s quit -c "$RUNNER_TEMP/ng.conf" 2>/dev/null || true

          kill $PA $PB $HOSTSVC 2>/dev/null || true
          echo
          echo "================================================"
          printf '  通过 %d 项，失败 %d 项\n' "$pass" "$fail"
          [ "$fail" -eq 0 ] && echo "  ★ 方案成立：私有 netns + unix socket 入站，可封掉实例间互连" \
                            || echo "  方案仍有缺口，见上方 ❌"
          echo "================================================"
          exit 0

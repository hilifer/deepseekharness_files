name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: 单元与接口测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 bubblewrap / passt / socat
        # 隔离测试要真跑沙箱。passt+socat 供 DSH_NETNS=1 的网络隔离用例使用。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap passt socat
          bwrap --version; pasta --version 2>&1 | head -1

      - name: 放开非特权 user namespace 限制
        # Ubuntu 24.04 起 AppArmor 默认拦截非特权 userns，bwrap 会报
        # "setting up uid map: Permission denied"。runner 有免密 sudo，
        # 直接放开即可。目标服务器若也是 24.04+，同样会撞上这条，
        # 处理办法见 OPS.md。
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: 确认沙箱在本 runner 上可用
        # 没这一步的话，隔离测试会被 skipUnless 静默跳过，CI 绿得毫无意义。
        run: |
          if ! bwrap --ro-bind / / --unshare-all --share-net true; then
            echo "::error::runner 上非特权 user namespace 不可用，隔离测试会被跳过"
            exit 1
          fi
          echo "✅ 沙箱可用"

      - name: 报告本 runner 的 Landlock 支持情况
        # 纯信息性，永不失败。Landlock 是「不需要 root 也不需要 userns」的那一档，
        # runner 内核支不支持决定了 env-matrix 里那个形状能不能真验。
        run: |
          uname -r
          python3 dsh-runtime/dsh-landlock-exec.py --selftest || true
          cat /sys/kernel/security/lsm 2>/dev/null || echo "(securityfs 未挂载)"

      - name: 跑测试
        run: python3 -m unittest discover -s tests -v

      - name: 确认隔离测试确实跑了（而非被跳过）
        run: |
          OUT=$(python3 -m unittest tests.test_sandbox 2>&1) || {
            echo "$OUT"; echo "::error::沙箱隔离测试失败"; exit 1; }
          echo "$OUT"
          if echo "$OUT" | grep -q "skipped"; then
            echo "::error::沙箱隔离测试被跳过了（skipUnless 生效），CI 绿得没有意义。"
            echo "::error::文件系统隔离需要 bubblewrap；网络隔离用例还需要 passt 与 socat。"
            exit 1
          fi
          echo "$OUT" | grep -qE "Ran ([0-9]+) tests" || { echo "::error::没跑到测试"; exit 1; }

  isolation-report:
    name: 隔离验收报告
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: 安装 bubblewrap / passt / socat
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap passt socat

      - name: 放开非特权 user namespace 限制
        # Ubuntu 24.04 起 AppArmor 默认拦截非特权 userns，bwrap 会报
        # "setting up uid map: Permission denied"。runner 有免密 sudo，
        # 直接放开即可。目标服务器若也是 24.04+，同样会撞上这条，
        # 处理办法见 OPS.md。
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: 搭一棵仿真部署树
        # 树的内容由 scripts/make-fake-deploy.sh 统一负责：隔离层现在是
        # 「调度器 + backends/ 下四个后端 + 容器入口脚本」，在 CI 里手抄一份
        # 拷贝清单，迟早会漏掉某个文件、而且只在运行时才炸。
        run: scripts/make-fake-deploy.sh "$HOME/fakedeploy" "$PWD"

      - name: 跑隔离验收（preflight）
        # 这一步同时也是 preflight 脚本自身的冒烟测试：它有 bash 错误就会在这里暴露。
        run: |
          set -o pipefail   # 否则 preflight 失败会被 tee 的成功退出码吞掉，job 假绿
          DSH_ROOT="$HOME/fakedeploy" "$HOME/fakedeploy/scripts/preflight-sandbox.sh" zhangsan \
            | tee "$RUNNER_TEMP/preflight.txt"
          echo '### 隔离验收结果' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/preflight.txt" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  shell:
    name: Shell 语法与 shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n 全量语法检查
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::bash 语法错误"; fail=1; }
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit $fail

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          # SC1091: 不追踪 source 的外部文件；SC2016: 单引号里的 $ 是 nginx 变量，不是待展开的
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck -S warning -e SC1091,SC2016 || true

  nginx-config:
    name: nginx 配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 nginx 与 openssl
        run: sudo apt-get update -qq && sudo apt-get install -y nginx-full openssl

      - name: 按线上路径布好 /home/ubuntu 目录树
        # 配置里全是 /home/ubuntu 绝对路径，必须原样搭出来才能 nginx -t
        run: |
          set -eu
          sudo mkdir -p /home/ubuntu
          sudo chown -R "$USER" /home/ubuntu
          mkdir -p /home/ubuntu/nginx/{conf/sites,logs,certs,tmp} \
                   /home/ubuntu/nginx/extracted/etc/nginx \
                   /home/ubuntu/{admin,filebrowser,scripts}
          cp -r nginx/conf/* /home/ubuntu/nginx/conf/
          cp /etc/nginx/mime.types /home/ubuntu/nginx/extracted/etc/nginx/mime.types
          cp filebrowser/config.yaml /home/ubuntu/filebrowser/
          cp scripts/init-secrets.sh /home/ubuntu/scripts/
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /home/ubuntu/nginx/certs/dsh.key \
            -out /home/ubuntu/nginx/certs/dsh.crt -subj '/CN=ci' 2>/dev/null

      - name: 生成密钥（站点配置 include 依赖它）
        run: /home/ubuntu/scripts/init-secrets.sh

      - name: nginx -t
        run: sudo nginx -t -c /home/ubuntu/nginx/conf/nginx.conf

      - name: 断言关键路由确实生成了
        run: |
          set -eu
          conf=/home/ubuntu/nginx/conf/nginx.conf
          site=/home/ubuntu/nginx/conf/sites/dsh-auth.conf
          grep -q 'map \$user \$dsh_upstream'  "$conf" || { echo "::error::缺 dsh 路由 map"; exit 1; }
          grep -q 'map \$user \$admin_upstream' "$conf" || { echo "::error::缺管理后台路由 map"; exit 1; }
          grep -q 'location = /files'           "$site" || { echo "::error::缺 /files 尾斜杠重定向"; exit 1; }
          grep -q 'location /admin/'            "$site" || { echo "::error::缺 /admin/ 站点"; exit 1; }
          # 管理后台与 /files 都必须挂 auth_request，不能有裸奔的入口
          for loc in '/admin/' '/files/'; do
            awk -v loc="location $loc" '
              index($0, loc) {inblock=1}
              inblock && /auth_request \/internal\/authelia\/authz/ {found=1}
              inblock && /^    }/ {inblock=0}
              END {exit !found}' "$site" \
              || { echo "::error::location $loc 没有 auth_request"; exit 1; }
          done
          echo "✅ 路由与鉴权断言通过"

  secrets-hygiene:
    name: 密钥卫生
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 仓库里不得出现真实密钥
        run: |
          set -eu
          fail=0
          # 私钥
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- . ':!*.yml'; then
            echo "::error::仓库里有私钥"; fail=1
          fi
          # 真实 argon2 哈希（.example 模板里的 REPLACE_ME 占位不算）
          if git grep -nE '\$argon2id\$v=19\$m=[0-9]+,t=[0-9]+,p=[0-9]+\$[A-Za-z0-9+/]{16,}' \
             -- . ':!*.example.yml' ':!tests/*'; then
            echo "::error::仓库里有真实 argon2 哈希"; fail=1
          fi
          # 生成的共享密钥不得入库
          for f in admin/.admin-token nginx/conf/generated dsh-users/registry.json; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f 被提交了，应由 .gitignore 排除"; fail=1
            fi
          done
          [ $fail -eq 0 ] && echo "✅ 未发现真实密钥"
          exit $fail

  apparmor-profile:
    name: AppArmor profile 放行 userns（不全局降级）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 bubblewrap 与 apparmor 工具
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap apparmor-utils

      - name: 基线 —— 确认 runner 上确实是「被 AppArmor 拦住」的状态
        # 目标服务器实测就是这个状态（sysctl = 1，bwrap 报 uid map Permission denied）。
        # 这一步同时也保证：如果哪天 runner 默认不再拦，本 job 会明确告知而不是假装通过。
        run: |
          set -u
          AA=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ ! -r "$AA" ]; then
            echo "::warning::runner 上没有该 sysctl，无法复现目标服务器的场景"; exit 0
          fi
          echo "sysctl = $(cat $AA)"
          if [ "$(cat $AA)" != "1" ]; then
            echo "::warning::runner 未开启该限制，本 job 失去意义"; exit 0
          fi
          if bwrap --ro-bind / / --unshare-all --share-net true 2>/dev/null; then
            echo "::error::限制开着 bwrap 却能跑，基线不成立"; exit 1
          fi
          echo "✅ 基线成立：bwrap 现在跑不起来"

      - name: 跑 apparmor-allow-userns.sh（profile 方式，不动全局 sysctl）
        run: sudo ./scripts/apparmor-allow-userns.sh

      - name: 断言 bwrap 可用，且全局限制【仍然开着】
        run: |
          set -u
          AA=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          [ -r "$AA" ] || exit 0
          if ! bwrap --ro-bind / / --unshare-all --share-net true; then
            echo "::error::profile 装了但 bwrap 仍不可用"; exit 1
          fi
          echo "✅ bwrap 可用"
          if [ "$(cat $AA)" != "1" ]; then
            echo "::error::全局 sysctl 被改成了 $(cat $AA) —— profile 方式不应削弱整机防护"; exit 1
          fi
          echo "✅ 全局限制仍为 1：只有 bwrap 拿到了 userns 权限，其余程序照旧受限"

      - name: 沙箱隔离测试在这种放行方式下同样通过
        run: python3 -m unittest tests.test_sandbox.SandboxIsolationTest -v

      - name: 回归 —— sudo 下要能找到【免 root 装在调用者家目录】的 bwrap
        # 真实部署顺序是：install-bubblewrap.sh 免 root 装到 $HOME/bwrap/，
        # 然后 sudo 跑本脚本。sudo 会把 $HOME 变成 /root，早先的实现会去
        # /root/bwrap/ 找而报「未找到 bwrap」。这里把系统 bwrap 暂时挪开来复现。
        run: |
          set -u
          mkdir -p "$HOME/bwrap/usr/bin"
          cp /usr/bin/bwrap "$HOME/bwrap/usr/bin/bwrap"
          sudo mv /usr/bin/bwrap /usr/bin/bwrap.hidden
          restore() { sudo mv -f /usr/bin/bwrap.hidden /usr/bin/bwrap 2>/dev/null || true; }
          trap restore EXIT

          OUT=$(sudo ./scripts/apparmor-allow-userns.sh --status 2>&1)
          echo "$OUT"
          if echo "$OUT" | grep -q "未安装"; then
            echo "::error::sudo 下没找到调用者家目录里的 bwrap —— SUDO_USER 回退失效"; exit 1
          fi
          echo "$OUT" | grep -q "$HOME/bwrap/usr/bin/bwrap" || {
            echo "::error::定位到的 bwrap 不是家目录里那个"; exit 1; }
          echo "✅ sudo 下正确定位到 $HOME/bwrap/usr/bin/bwrap"

  alt-root:
    name: 非 /home/ubuntu 部署根
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: 安装依赖
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap nginx-light openssl

      - name: 放开非特权 user namespace 限制
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: 部署到 /home/robot 并改根
        # 仓库里的配置默认写死 /home/ubuntu。这个 job 证明换个部署根也能跑通，
        # 从而不必依赖「服务器上的用户一定叫 ubuntu」这个前提。
        run: |
          set -eu
          R=/home/robot
          sudo mkdir -p "$R" && sudo chown -R "$USER" "$R"
          cp -r . "$R/" && rm -rf "$R/.git"
          mkdir -p "$R"/nginx/{logs,certs,tmp} "$R"/nginx/extracted/etc/nginx \
                   "$R"/{dsh-users,dsh-files/departments,filebrowser/logs}
          cp /etc/nginx/mime.types "$R/nginx/extracted/etc/nginx/mime.types"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$R/nginx/certs/dsh.key" -out "$R/nginx/certs/dsh.crt" -subj '/CN=ci' 2>/dev/null
          "$R/scripts/configure-root.sh" "$R"
          echo "--- 确认配置里已无 /home/ubuntu ---"
          if grep -rn "/home/ubuntu" "$R/nginx/conf" "$R/filebrowser/config.yaml"; then
            echo "::error::改根后仍有 /home/ubuntu 残留"; exit 1
          fi
          echo "✅ 无残留"

      - name: 在新根下生成密钥并校验 nginx 配置
        run: |
          set -eu
          R=/home/robot
          DSH_ROOT="$R" "$R/scripts/init-secrets.sh"
          nginx -t -c "$R/nginx/conf/nginx.conf"
          grep -q "$R/nginx/certs/dsh.crt" "$R/nginx/conf/sites/dsh-auth.conf"
          echo "✅ nginx 在新根下配置有效"

      - name: 在新根下启动管理后台并打通接口
        run: |
          set -eu
          R=/home/robot
          DSH_ROOT="$R" ADMIN_PORT=19277 nohup python3 "$R/admin/app.py" \
            > "$R/admin.log" 2>&1 &
          for _ in $(seq 1 15); do
            curl -sf -o /dev/null -H "X-Admin-Token: $(cat "$R/admin/.admin-token")" \
              -H "Remote-User: admin" http://127.0.0.1:19277/admin/api/health && break
            sleep 1
          done
          OUT=$(curl -s -H "X-Admin-Token: $(cat "$R/admin/.admin-token")" \
                     -H "Remote-User: admin" http://127.0.0.1:19277/admin/api/health)
          echo "health: $OUT"
          echo "$OUT" | grep -q '"sandbox_ok": *true' || {
            echo "::error::新根下沙箱自检未通过: $OUT"; tail -20 "$R/admin.log"; exit 1; }
          # 无 token 必须被拒
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Remote-User: admin" \
                 http://127.0.0.1:19277/admin/api/users)
          [ "$CODE" = "403" ] || { echo "::error::无 token 时应 403，实际 $CODE"; exit 1; }
          echo "✅ 管理后台在新根下工作正常，且鉴权仍然生效"

      - name: 在新根下跑沙箱隔离测试
        run: |
          set -eu
          R=/home/robot
          cd "$R" && DSH_ROOT="$R" python3 -m unittest tests.test_sandbox.SandboxIsolationTest
          echo "✅ 沙箱在新根下同样生效"

  env-matrix:
    # ------------------------------------------------------------------
    # 环境形状矩阵 —— 这个项目要能跑在【任何形状的机器】上，不能只在某一台
    # 上验过就算数。这里用不同的 `docker run` 参数把同一套验收脚本丢进几种
    # 真实会遇到的形状里跑，逐个断言：
    #   1 调度器在这个形状下挑对了档
    #   2 挑中的那一档【真的隔离住了】（跑完整 preflight，读不到才算过）
    #   3 一档都挑不出来时确实拒绝启动，而不是悄悄裸跑
    # 其中「非 root + 挂了宿主 docker socket」就是现场那台机器的形状。
    # ------------------------------------------------------------------
    name: 环境形状 ${{ matrix.shape }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shape: 容器·非root·无命名空间·无docker（自动落到Landlock）
            expect: landlock
            args: ''
            nonroot: 'yes'
            block_userns: '1'
            need_image: 'no'
            dind: 'no'
            isolation: 'auto'
          - shape: 容器·非root·连Landlock也没有（必须拒绝启动）
            expect: refuse
            args: ''
            nonroot: 'yes'
            block_userns: '1'
            need_image: 'no'
            dind: 'no'
            # 候选里刻意不含 container/landlock：验的是「一档都不成立时
            # 到底拒不拒绝」，带上还活着的档就验不到 fail-closed 了
            isolation: 'bwrap uid none'
          - shape: 容器·root·无命名空间·无docker
            expect: uid
            args: ''
            nonroot: 'no'
            block_userns: '1'
            need_image: 'no'
            dind: 'no'
            # 钉死 uid：auto 现在会优先挑 landlock（那是对的，它更强），
            # 但 uid 档本身也要有人验
            isolation: 'uid'
          - shape: 容器·非root·无命名空间·挂了宿主docker-socket
            expect: container
            args: '-v /var/run/docker.sock:/var/run/docker.sock -v /usr/bin/docker:/usr/bin/docker:ro'
            nonroot: 'yes'
            block_userns: '1'
            need_image: 'yes'
            dind: 'no'
            isolation: 'auto'
          - shape: 容器·root·特权
            expect: bwrap
            args: '--privileged'
            nonroot: 'no'
            block_userns: '0'
            need_image: 'no'
            dind: 'no'
            isolation: 'auto'
          - shape: 容器·特权·容器内自跑dockerd（真嵌套）
            expect: container
            args: '--privileged'
            nonroot: 'no'
            block_userns: '0'
            need_image: 'no'
            dind: 'yes'
            isolation: 'auto'
          - shape: 容器·非root·只有Landlock可用
            expect: landlock
            args: ''
            nonroot: 'yes'
            block_userns: '1'
            need_image: 'no'
            dind: 'no'
            isolation: 'landlock'
    steps:
      - uses: actions/checkout@v4

      - name: 保持宿主的 userns 限制开着
        # Ubuntu 24.04 的默认状态就是 1。容器形状要模拟的正是「宿主不配合、
        # 容器内改不了」，所以这里不放开——放开了就等于把待验的前提抹掉。
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
            cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          else
            echo "（本 runner 没有这个开关）"
          fi

      - name: 造一个带依赖的形状基础镜像
        # 形状容器要以非 root 跑（那才是真实部署的样子），非 root 装不了包，
        # 所以依赖预先烤进镜像。
        run: |
          cat > "$RUNNER_TEMP/Dockerfile.shape" <<'DOCKERFILE'
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y --no-install-recommends \
                bash python3 bubblewrap socat curl iproute2 acl \
                passwd util-linux findutils coreutils ca-certificates \
           && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          docker build -t ci-shape:base -f "$RUNNER_TEMP/Dockerfile.shape" "$RUNNER_TEMP"

      - name: 为嵌套形状加装 docker 引擎
        if: matrix.dind == 'yes'
        # 真·嵌套需要容器【自己】跑 dockerd，所以引擎得装在形状镜像里。
        # 只有这一个形状需要，别的形状不背这个体积和构建时间。
        run: |
          cat > "$RUNNER_TEMP/Dockerfile.dind" <<'DOCKERFILE'
          FROM ci-shape:base
          RUN apt-get update && apt-get install -y --no-install-recommends \
                docker.io \
           && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          docker build -t ci-shape:dind -f "$RUNNER_TEMP/Dockerfile.dind" "$RUNNER_TEMP"

      - name: 构建实例镜像（只有 container 形状需要）
        if: matrix.need_image == 'yes'
        run: DSH_ROOT="$PWD" scripts/build-dsh-image.sh

      - name: 跑形状验收
        run: |
          # 默认 shell 是 bash -e，没有 pipefail —— 不加的话形状验收失败会被
          # 管道末端的 tee 吞掉，job 假绿。
          set -euo pipefail
          ARGS="${{ matrix.args }}"
          if [ "${{ matrix.nonroot }}" = "yes" ]; then
            # 以 runner 自己的 uid 跑：既是「非 root」，又能写得动挂进去的工作区
            ARGS="$ARGS --user $(id -u):$(id -g)"
            if [ -S /var/run/docker.sock ]; then
              ARGS="$ARGS --group-add $(stat -c %g /var/run/docker.sock)"
            fi
          fi
          # 刻意把仓库挂到【和宿主不同的路径】/deploy 上：容器后端必须自己
          # 算出「/deploy/... 在宿主上是 $PWD/...」才能挂对，路径同构就验不到了。
          IMAGE=ci-shape:base
          START_DOCKERD=0
          if [ "${{ matrix.dind }}" = "yes" ]; then IMAGE=ci-shape:dind; START_DOCKERD=1; fi
          # shellcheck disable=SC2086
          docker run --rm \
            -v "$PWD:/deploy" -w /deploy \
            -e REPO=/deploy \
            -e "SHAPE_BLOCK_USERNS=${{ matrix.block_userns }}" \
            -e "SHAPE_START_DOCKERD=$START_DOCKERD" \
            -e "DSH_ISOLATION=${{ matrix.isolation }}" \
            $ARGS \
            "$IMAGE" \
            bash /deploy/tests/env-shape.sh "${{ matrix.expect }}" /deploy/fakedeploy \
            2>&1 | tee "$RUNNER_TEMP/shape.txt"

      - name: 结果写进 job summary
        if: always()
        run: |
          {
            echo "### 形状 ${{ matrix.shape }}（期望 ${{ matrix.expect }}）"
            echo '```'
            cat "$RUNNER_TEMP/shape.txt" 2>/dev/null || echo "（没有输出）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

# ================= dsh app (protected, port 8099) =================
server {
    listen 8099 ssl;
    server_name _;

    ssl_certificate     /home/ubuntu/nginx/certs/dsh.crt;
    ssl_certificate_key /home/ubuntu/nginx/certs/dsh.key;

    set $upstream_authelia http://127.0.0.1:19091/api/authz/auth-request;

    # --- Authelia authz virtual endpoint ---
    location /internal/authelia/authz {
        internal;
        proxy_pass $upstream_authelia;

        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL $scheme://$host$port_suffix$request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Content-Length "";
        proxy_set_header Connection "";

        proxy_pass_request_body off;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_redirect http:// $scheme://;
        proxy_http_version 1.1;
        proxy_cache_bypass $cookie_session;
        proxy_no_cache $cookie_session;
        proxy_buffers 4 32k;
        client_body_buffer_size 128k;
        send_timeout 5m;
        proxy_read_timeout 240;
        proxy_send_timeout 240;
        proxy_connect_timeout 240;
    }

    # /files（无尾斜杠）不匹配 location /files/，会落到 location / 打到 dsh 实例
    location = /files { return 301 /files/; }

    # --- FileBrowser 子路径代理（baseURL=/files，转发 X-Forwarded-User 做代理认证） ---
    location /files/ {
        auth_request /internal/authelia/authz;

        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $redirection_url $upstream_http_location;
        error_page 401 =302 $redirection_url;

        # FileBrowser proxy-auth。头【名字】本身是密钥，由 init-secrets.sh 生成，
        # 与 filebrowser/config.yaml 的 auth.methods.proxy.header 保持一致。
        # 原因：dsh 沙箱共享宿主网络命名空间，能连上 127.0.0.1:18080，
        # 若沿用固定的 X-Forwarded-User，任何员工都能伪造 admin 身份直调
        # FileBrowser API 读写全公司文件——文件系统隔离会被整个绕过。
        # 沙箱内看不到 config.yaml 和本文件，因而拿不到这个头名。
        include /home/ubuntu/nginx/conf/generated/fb-auth.conf;
        proxy_set_header X-Forwarded-User "";
        proxy_set_header Authorization "";

        proxy_pass http://127.0.0.1:18080/files/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE 长连接（/files/api/events）：必须禁用缓冲才能实时推送
        proxy_buffering off;
        proxy_cache off;

        proxy_set_header Host $host$port_suffix;
        proxy_set_header Origin $scheme://$host$port_suffix;
        proxy_set_header X-Original-URL $scheme://$host$port_suffix$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host$port_suffix;
        proxy_set_header X-Forwarded-URI $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        send_timeout 5m;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_connect_timeout 360;
    }

    # --- 员工管理后台（仅管理员）---
    location /admin/ {
        auth_request /internal/authelia/authz;

        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $redirection_url $upstream_http_location;
        error_page 401 =302 $redirection_url;

        proxy_set_header Remote-User $user;
        # 共享密钥：证明请求确实经由 nginx。沙箱里的 dsh 能连到 19200，
        # 但读不到宿主上的 admin/.admin-token，因此调不动这个 API。
        include /home/ubuntu/nginx/conf/generated/admin-token.conf;

        # 非管理员 -> $admin_upstream 落到黑洞 13100 -> 403
        proxy_pass http://$admin_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host$port_suffix;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        send_timeout 5m;
        proxy_read_timeout 360;
        proxy_send_timeout 360;
        proxy_connect_timeout 30;
    }

    # --- protected dsh app ---
    location / {
        auth_request /internal/authelia/authz;

        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $name $upstream_http_remote_name;
        auth_request_set $email $upstream_http_remote_email;

        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Email $email;
        proxy_set_header Remote-Name $name;

        # Modern redirect method: uses authelia_url from session cookies config
        auth_request_set $redirection_url $upstream_http_location;
        error_page 401 =302 $redirection_url;

        # 路由由 nginx.conf 的 map $user $dsh_upstream 决定（懒求值，auth 完成后取值）
        # 未匹配用户 -> default 127.0.0.1:13100（黑洞 -> 403）
        proxy_pass http://$dsh_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host$port_suffix;
        proxy_set_header Origin $scheme://$host$port_suffix;
        proxy_set_header X-Original-URL $scheme://$host$port_suffix$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host$port_suffix;
        proxy_set_header X-Forwarded-URI $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        send_timeout 5m;
        proxy_read_timeout 360;
        proxy_send_timeout 360;
        proxy_connect_timeout 360;
    }
}

# ================= 黑洞端口（map 未匹配用户 -> 403） =================
server {
    listen 127.0.0.1:13100;
    server_name _;
    return 403;
}

# ================= Authelia portal (port 9091) =================
server {
    listen 9091 ssl;
    server_name _;

    ssl_certificate     /home/ubuntu/nginx/certs/dsh.crt;
    ssl_certificate_key /home/ubuntu/nginx/certs/dsh.key;

    location / {
        proxy_pass http://127.0.0.1:19091;
        proxy_http_version 1.1;

        proxy_set_header Host $host$port_suffix;
        proxy_set_header X-Original-URL $scheme://$host$port_suffix$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host$port_suffix;
        proxy_set_header X-Forwarded-URI $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        send_timeout 5m;
        proxy_read_timeout 360;
        proxy_send_timeout 360;
        proxy_connect_timeout 360;
    }
}
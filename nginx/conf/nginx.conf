worker_processes 2;
pid /home/ubuntu/nginx/nginx.pid;
error_log /home/ubuntu/nginx/logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /home/ubuntu/nginx/extracted/etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /home/ubuntu/nginx/logs/access.log;

    sendfile on;
    keepalive_timeout 65;
    # 文件上传插件单文件上限 100 MiB，multipart 编码另有开销；
    # 这里留到 256m，否则接近上限的文件会被 nginx 以 413 拦掉。
    client_max_body_size 256m;

    client_body_temp_path /home/ubuntu/nginx/tmp/client_body;
    proxy_temp_path /home/ubuntu/nginx/tmp/proxy;
    fastcgi_temp_path /home/ubuntu/nginx/tmp/fastcgi;
    uwsgi_temp_path /home/ubuntu/nginx/tmp/uwsgi;
    scgi_temp_path /home/ubuntu/nginx/tmp/scgi;

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Port suffix map (custom ports 8099/9091)
    map $http_host $port_suffix {
        "~:(?<port>\d+)$"  ":$port";
        default            "";
    }

    # dsh user -> dsh upstream 路由（懒求值：proxy_pass 引用 $dsh_upstream 时
    # 才求值 $user，此时 auth_request_set 已完成赋值；default 指向黑洞 13100 -> 403）
    map $user $dsh_upstream {
        default     127.0.0.1:13100;
        "admin"     127.0.0.1:3080;
        "zhangsan"  127.0.0.1:13101;
        "lisi"      127.0.0.1:13102;
        "zhaoliu"   127.0.0.1:13103;
    }

    # 管理后台路由：只有管理员能到 19200，其余人落到黑洞 13100 -> 403。
    # 为什么不用 `if ($user = admin)`：$user 由 auth_request_set 在 access 阶段赋值，
    # 而 if 在 rewrite 阶段执行，那时取不到值——和 $dsh_upstream 是同一个坑。
    map $user $admin_upstream {
        default     127.0.0.1:13100;
        "admin"     127.0.0.1:19200;
    }

    include /home/ubuntu/nginx/conf/sites/*.conf;
}
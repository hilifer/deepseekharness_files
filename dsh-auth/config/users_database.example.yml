# Authelia 用户数据库模板。真实文件为 users_database.yml（勿提交）。
# 生成 argon2 哈希: authelia crypto hash generate argon2 --password '你的密码'
users:
  admin:
    displayname: admin
    password: $argon2id$v=19$m=65536,t=3,p=4$REPLACE_ME
    email: admin@example.com
    groups: []
  zhangsan:
    displayname: 张三
    password: $argon2id$v=19$m=65536,t=3,p=4$REPLACE_ME
    email: zhangsan@example.com
    groups: []
